# Dependabot — grouped weekly updates for the Intervyn monorepo.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # JS/TS workspace (pnpm). Covers frontend, frontend/packages/*, frontend/cli via the
  # frontend/pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-only:
        patterns:
          - "@types*"
          - "eslint*"
          - "prettier"
          - "vitest"
          - "typescript"
    open-pull-requests-limit: 10

  # Python (uv). Dependabot's `pip` ecosystem reads pyproject.toml/uv.lock in
  # backend and backend/services/lightrag.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /backend/services/lightrag
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Docker base images (agent/web/lightrag Dockerfiles).
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: /backend/services/lightrag
    schedule:
      interval: weekly
      day: monday

  # GitHub Actions (ci.yml / deploy.yml).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
