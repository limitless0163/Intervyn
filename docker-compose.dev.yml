# Development override: run Next.js in dev mode and mount the working tree so
# frontend edits trigger Fast Refresh. The base compose file still provides
# the agent API and knowledge sidecar.
services:
  web:
    build:
      target: deps
    working_dir: /repo
    command:
      - sh
      - -lc
      - pnpm --filter @intervyn/shared build && exec pnpm --filter @intervyn/web dev --hostname 0.0.0.0
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/repo
      # Keep Linux-installed workspace dependencies separate from any macOS
      # node_modules on the host. `make dev` renews these when the image changes.
      - /repo/node_modules
      - /repo/frontend/node_modules
      - /repo/frontend/cli/node_modules
      - /repo/frontend/packages/shared/node_modules
      - /repo/frontend/packages/ee/node_modules
      - /repo/backend/node_modules
      # Next's cache contains platform-specific build artifacts.
      - /repo/frontend/.next
